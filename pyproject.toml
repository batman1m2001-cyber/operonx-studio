# One installable distribution carrying both halves of the tooling:
#
#   operonx_project   manifest, extract, lint, scaffold, typed source edits
#   operonx_studio    the app — home screen, per-project daemons, the canvas
#
# They ship together because the studio is unusable without the extraction
# toolkit and the toolkit's main consumer is the studio. Splitting them into
# two distributions doubled the release surface for no one's benefit.
#
# This repo is deliberately separate from operonx itself. The library is
# what programs import; this is what a person points at a project. The
# studio never runs inside the project's interpreter — extraction happens
# in a subprocess under the *project's* venv — so nothing here needs to be
# installed into the projects it inspects.

[project]
name = "operonx-studio"
version = "0.3.0"
description = "Visual studio and project tooling for operonx — open a project, see the flow."
requires-python = ">=3.10"
dependencies = [
    # the ClickHouse driver: a project whose [tracing] records to ClickHouse
    # is read from there
    "operonx[clickhouse]>=1.17.1",
    "tomli>=2.0; python_version < '3.11'",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "rcssmin>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.24",
    "ruff>=0.1",
    "operonx-agents>=0.1.3",  # an agent op's tools in the IR (tests/project/test_extract.py)
]
redis = [
    "redis>=4.5",
]

[project.scripts]
operonx-studio = "operonx_studio.cli:main"
operonx-lint = "operonx_project.cli:main"
operonx-extract = "operonx_project.cli:extract_main"
operonx-new = "operonx_project.cli:new_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operonx_project", "operonx_studio"]

[tool.uv.sources]
operonx = { path = "../Operon", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["unit: fast, no subprocess, no network"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E731 / F841 as in operonx's own config: a lambda for a one-line helper
# and a name kept for an assert's readability are intended.
extend-ignore = ["E712", "F401", "F541", "E501", "E731", "F841"]

[tool.ruff.lint.per-file-ignores]
# OKLab's own names: l, m, s are the cone responses in every reference.
"operonx_studio/theme.py" = ["E741"]
# pytest fixtures shared by import (`from test_assistant import fake`)
# are "redefined" as parameters by design.
"tests/**" = ["F811"]
# one-off measurement scripts, run by hand: terse on purpose
"scripts/perf/**" = ["E701", "E702", "E722", "E741"]

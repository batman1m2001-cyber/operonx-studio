<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
<title>Sign in — operonx studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c9940f'/%3E%3Ccircle cx='12' cy='12' r='5.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='18.3' cy='5.7' r='1.7' fill='white'/%3E%3C/svg%3E">
<script>/* the theme before the first paint (theme.js keeps it in step) */try{var t=localStorage.getItem("ox:theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/static/studio.css">
</head>
<body class="page">
<main class="loginwrap">
  <div class="logincard">
    <svg class="mark big" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6"/><circle cx="12" cy="12" r="5.2"/><circle class="dot" cx="18.3" cy="5.7" r="1.7"/></svg>
    <section id="step-signin">
      <h1 class="logintitle">Sign in to operonx studio</h1>
      <p class="loginhint">Your flows, runs and jobs, from anywhere.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-user">Username</label>
          <input type="text" id="login-user" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
        </div>
        <div class="field">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" autocomplete="current-password" required>
        </div>
        <div class="loginerr" id="login-err" role="alert"></div>
        <button class="primary loginbtn" type="submit" id="login-btn">Sign in</button>
      </form>
    </section>
    <section id="step-password" hidden>
      <h1 class="logintitle">Choose your password</h1>
      <p class="loginhint">Signed in as <b id="pw-who"></b>. The password you used is temporary — choose your own to continue.</p>
      <form id="pw-form" novalidate>
        <input type="text" id="pw-user" autocomplete="username" hidden readonly>
        <div class="field">
          <label for="pw-new">New password</label>
          <input type="password" id="pw-new" autocomplete="new-password" minlength="8" required aria-describedby="pw-rule">
        </div>
        <div class="field">
          <label for="pw-again">New password, again</label>
          <input type="password" id="pw-again" autocomplete="new-password" minlength="8" required>
        </div>
        <p class="loginrule" id="pw-rule">At least 8 characters, and not your username.</p>
        <div class="loginerr" id="pw-err" role="alert"></div>
        <button class="primary loginbtn" type="submit" id="pw-btn">Save and continue</button>
        <a class="loginalt" href="/logout">Sign out instead</a>
      </form>
    </section>
  </div>
</main>
<script src="/static/login.js"></script>
</body>
</html>

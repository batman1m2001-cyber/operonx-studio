<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sign in — operonx studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c9940f'/%3E%3Ccircle cx='12' cy='12' r='5.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='18.3' cy='5.7' r='1.7' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/studio.css">
</head>
<body class="page">
<main class="loginwrap">
  <div class="logincard">
    <svg class="mark big" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6"/><circle cx="12" cy="12" r="5.2"/><circle class="dot" cx="18.3" cy="5.7" r="1.7"/></svg>
    <h1 class="logintitle">Sign in to operonx studio</h1>
    <p class="loginhint">Your flows, runs and jobs, from anywhere.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-user">Username</label>
        <input type="text" id="login-user" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <input type="password" id="login-pass" autocomplete="current-password" required>
      </div>
      <div class="loginerr" id="login-err" role="alert"></div>
      <button class="primary loginbtn" type="submit" id="login-btn">Sign in</button>
    </form>
  </div>
</main>
<script>
document.getElementById("login-form").onsubmit = async (ev) => {
  ev.preventDefault();
  const err = document.getElementById("login-err");
  const btn = document.getElementById("login-btn");
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "Signing in…";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({
        username: document.getElementById("login-user").value,
        password: document.getElementById("login-pass").value,
      }),
    });
    if (res.ok) { location.href = "/"; return; }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || "Sign-in failed.";
  } catch {
    err.textContent = "The studio did not answer — is it still running?";
  }
  btn.disabled = false;
  btn.textContent = "Sign in";
};
</script>
</body>
</html>

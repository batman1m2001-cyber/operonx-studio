<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>operonx studio</title>
<link rel="stylesheet" href="/static/studio.css">
</head>
<body>
<div class="shell">
  <header class="bar">
    <a class="crumb" href="/">studio</a>
    <span class="crumb">/</span>
    <button class="pname" id="pname" title="switch project">…</button>
    <div id="switcher" hidden></div>
    <select id="graph-pick" title="graph"></select>
    <nav class="tabs">
      <button data-tab="flow" class="active">Flow</button>
      <button data-tab="traces">Traces</button>
    </nav>
    <div class="spacer"></div>
    <div class="zoomctl" title="scroll to pan · ctrl+scroll or pinch = zoom · space+drag or middle-drag = pan">
      <button id="btn-zoom-out">−</button>
      <button id="btn-zoom-pct" title="reset to 100%">100%</button>
      <button id="btn-zoom-in">+</button>
      <button id="btn-fit" title="fit the flow's width (0) — read down by scrolling">Fit</button>
      <button id="btn-expand" title="open / close every nested graph">⊞</button>
      <button id="btn-find" title="find a node (/ or Ctrl+K)">🔍</button>
      <button id="btn-legend" title="what am I looking at?">?</button>
    </div>
    <button id="btn-left" class="paneltoggle" title="info panel">◧</button>
    <button id="btn-right" class="paneltoggle" title="assistant panel">◨</button>
    <span class="live" id="live"><span class="dot"></span><span id="live-text">live</span></span>
  </header>

  <div id="runbanner">
    <span>Run <b id="run-name"></b></span>
    <span id="run-stats"></span>
    <button id="run-err" hidden>error →</button>
    <button id="run-clear">Clear</button>
  </div>

  <div class="main">
    <aside id="inspector" class="open"></aside>
    <div id="dragbar" title="drag to resize · double-click to reset"></div>
    <div id="stage">
      <div id="world">
        <div id="plane">
          <svg id="edges"></svg>
          <div id="nodes"></div>
        </div>
      </div>
      <div id="find" hidden>
        <input id="find-input" placeholder="find node… (Enter selects, Esc closes)" autocomplete="off">
      </div>
      <div id="legend" hidden></div>
    </div>
    <div id="traces" hidden></div>
    <aside id="chatdock" hidden></aside>
  </div>
</div>
<script src="/static/values.js"></script>
<script src="/static/studio.js"></script>
<script src="/static/chat.js"></script>
</body>
</html>

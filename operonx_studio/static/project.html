<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
<title>operonx studio</title>
<link rel="icon" type="image/png" href="/static/operonx-favicon.png">
<script>/* the theme and the glass before the first paint (theme.js keeps them in step) */try{var t="dark";document.documentElement.dataset.theme=t;var g=localStorage.getItem("ox:glass")||"system";if(g==="system")g=matchMedia("(prefers-reduced-transparency: reduce), (prefers-contrast: more)").matches?"solid":"glass";document.documentElement.dataset.glass=g;/* no GPU (a software renderer): glass is not blurred live, studio-dark.css; asked once, kept */var u=localStorage.getItem("ox:gpu");if(!u){u="hard";var c=document.createElement("canvas"),l=c.getContext("webgl2")||c.getContext("webgl");if(l){var d=l.getExtension("WEBGL_debug_renderer_info"),n=String(d?l.getParameter(d.UNMASKED_RENDERER_WEBGL):l.getParameter(l.RENDERER));if(/swiftshader|llvmpipe|softpipe|software|basic render|warp/i.test(n))u="soft";var x=l.getExtension("WEBGL_lose_context");x&&x.loseContext()}else u="soft";localStorage.setItem("ox:gpu",u)}document.documentElement.dataset.gpu=u}catch(e){}</script>
<link rel="stylesheet" href="/static/studio.css">
<link rel="stylesheet" href="/static/factory.css">
</head>
<body data-tab="flow">
<div class="shell">
  <header class="bar">
    <a class="brand" href="/" title="All projects" aria-label="operonx studio — all projects">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-name">operonx</span>
    </a>
    <nav class="crumbs" aria-label="Location">
      <span class="sep" aria-hidden="true">/</span>
      <button class="crumbbtn projname" id="pname" aria-haspopup="menu" title="Switch project">…</button>
      <span class="live" id="live" role="status" title="Watching the project's code: the studio redraws when it changes"><span class="dot"></span><span id="live-text">Live</span></span>
      <div id="switcher" class="popover" role="menu" hidden></div>
      <span class="sep" aria-hidden="true">/</span>
      <button id="btn-project" class="crumbbtn graphname" aria-haspopup="menu" title="Flows"><span id="graph-name">…</span></button>
      <div id="pmenu" class="popover" role="menu" hidden></div>
      <select id="graph-pick" title="graph" hidden></select>
    </nav>
    <!-- the open rail item's screens (shell.js HUBS) -->
    <nav class="tabs hubtabs" id="hubtabs" role="tablist" aria-label="Screens of this section" hidden>
      <button data-tab="flow" data-view="factory" data-in="flow" role="tab" title="The whole project as one picture: its flows, services and jobs, what they share, the data they pass on">Picture</button>
      <button data-tab="flow" data-view="flows" data-in="flow" class="active" role="tab" aria-selected="true" data-folded title="A flow is opened from the picture; the Picture tab leads back">Flow</button>
      <button data-tab="prompts" data-in="flow" role="tab">Prompts</button>
      <button data-tab="services" data-in="flow" role="tab" data-folded title="Folded into the picture: the listeners are on its first line, the services in the list beside it">Services</button>
      <button data-tab="jobs" data-in="flow" role="tab" data-folded title="Folded into the picture: click a job on it, or in the list beside it">Jobs</button>
      <button data-tab="knowledge" data-in="flow" role="tab" hidden>Knowledge</button>
      <button data-tab="traces" data-in="runs" role="tab">Runs</button>
      <button data-tab="review" data-in="runs" role="tab">Review</button>
      <button data-tab="evals" data-in="runs" role="tab">Evals</button>
      <button data-tab="monitor" data-in="monitor" role="tab">Monitor</button>
      <button data-tab="alerts" data-in="monitor" role="tab">Alerts</button>
      <button data-tab="resources" data-in="settings" role="tab">Resources</button>
      <button data-tab="settings" data-in="settings" role="tab">Storage</button>
      <button data-tab="projectsettings" data-in="settings" role="tab">Project</button>
    </nav>
    <button id="btn-screen" class="crumbbtn screenbtn" aria-haspopup="true" aria-controls="rail" title="Screens"><i data-icon="menu"></i><span id="screen-label">Flow</span></button>
    <div class="spacer"></div>
    <!-- the project's own app (web/ served at / by operonx serve), in a new tab; greyed with the reason -->
    <a id="btn-app" class="appbtn" target="_blank" rel="noopener" aria-disabled="true" title="Looking for the app…">Open app ↗</a>
    <span id="themeslot"></span>
    <button id="btn-right" class="iconbtn paneltoggle" aria-label="Toggle the side panel" title="Side panel — inspect · assistant  ( ] )"><i data-icon="panel"></i></button>
    <span id="accountslot"></span>
  </header>

  <div class="main">
    <!-- the screens, by what they are for: slim on a tablet, a drawer on a phone -->
    <aside class="rail" id="rail" aria-label="Screens">
      <nav class="tabs" role="tablist" aria-label="Views">
        <button data-tab="flow" data-hub="flow" class="active" role="tab" title="Flow — the flows, prompts, services, jobs"><i data-icon="graph"></i><span>Flow</span></button>
        <button data-tab="traces" data-hub="runs" role="tab" title="Runs — every run, reviewing them, evals"><i data-icon="list"></i><span>Runs</span></button>
        <button data-tab="monitor" data-hub="monitor" role="tab" title="Monitor — health over time, and alerts"><i data-icon="chart"></i><span>Monitor</span></button>
        <button data-tab="resources" data-hub="settings" role="tab" title="Settings — resources, run storage, the project"><i data-icon="settings"></i><span>Settings</span></button>
      </nav>
      <button id="rail-slim" class="railtoggle" type="button" title="Collapse the menu" aria-label="Collapse the menu"><i data-icon="collapse"></i><span>Collapse</span></button>
    </aside>
    <div id="railshade" hidden></div>
    <!-- the Flow screen's flows, always in view; [ hides it (flowrail.js) -->
    <aside id="flowrail" class="flowrail" aria-label="Flows"></aside>
    <div id="stage">
      <div id="world">
        <div id="plane">
          <!-- a generator's stack: copies of its card, under the wires -->
          <div id="stacks"></div>
          <svg id="edges" class="wires"></svg>
          <!-- data flow: connectors under the cards, tray and tags above -->
          <svg id="dflinks" class="wires dflinks"></svg>
          <div id="nodes"></div>
          <div id="dfover"></div>
          <!-- decision wires re-surface here: the stretch that would
               hide under a branch card paints again above it -->
          <svg id="edgetop" class="wires"></svg>
        </div>
      </div>
    </div>
    <!-- the project as one picture: the first row of the flows rail (factory.js) -->
    <div id="factory"></div>
    <div id="traces" hidden></div>
    <div id="jobs" hidden></div>
    <div id="resources" hidden></div>
    <div id="evals" class="pane" hidden></div>
    <div id="knowledge" class="pane" hidden></div>
    <div id="services" class="pane" hidden></div>
    <div id="review" class="pane" hidden></div>
    <div id="prompts" class="pane" hidden></div>
    <div id="yaml" class="pane" hidden></div>
    <div id="alerts" class="pane" hidden></div>
    <div id="projectsettings" class="pane" hidden></div>
    <div id="monitor" class="pane" hidden></div>
    <div id="settings" class="pane" hidden></div>

    <!-- the canvas's own controls: they float over the canvas wherever it
         is showing (the Flow tab, or a run's workflow view) -->
    <div id="minimap" class="minimap" hidden><canvas aria-label="The whole flow: click to move the view"></canvas></div>
    <div id="canvasbar" class="canvasbar" role="toolbar" aria-label="Canvas">
      <button id="btn-play" class="playbtn needs-edit" aria-pressed="false" title="Play: give this flow an input at its START and watch its ops light up"><i data-icon="play"></i><span>Play</span></button>
      <span class="tsep" aria-hidden="true"></span>
      <button id="btn-flowrail" class="iconbtn" aria-label="Show the flows" aria-pressed="true" title="Flows panel  ( [ )"><i data-icon="panelleft"></i></button>
      <button id="btn-factory" class="iconbtn" aria-label="Project picture" aria-pressed="false" title="Project picture: the whole project as one model"><i data-icon="box"></i></button>
      <span class="tsep" aria-hidden="true"></span>
      <button id="btn-find" class="iconbtn" aria-label="Find a node" title="Find a node  ( / or Ctrl+K )"><i data-icon="search"></i></button>
      <button id="btn-expand" class="iconbtn" aria-label="Open every nested graph" title="Open / close every nested graph"><i data-icon="unfold"></i></button>
      <span class="tsep" aria-hidden="true"></span>
      <button id="btn-zoom-pct" class="zoompct" aria-haspopup="menu" aria-expanded="false" aria-controls="zoommenu" title="Zoom"><span id="zoom-pct">100%</span><i data-icon="chevron"></i></button>
      <div id="zoommenu" class="popover zoommenu" role="menu" aria-label="Zoom" hidden>
        <button type="button" role="menuitem" data-zoom="in"><i data-icon="plus"></i><span>Zoom in</span><kbd>+</kbd></button>
        <button type="button" role="menuitem" data-zoom="out"><i data-icon="minus"></i><span>Zoom out</span><kbd>−</kbd></button>
        <button type="button" role="menuitem" data-zoom="100"><span class="zm-pad"></span><span>Zoom to 100%</span><kbd>1</kbd></button>
        <button type="button" role="menuitem" data-zoom="fit"><i data-icon="fit"></i><span>Fit the flow</span><kbd>0</kbd></button>
      </div>
      <button id="btn-flowdots" class="iconbtn" aria-label="Show direction" aria-pressed="true" title="Direction: a light dot runs each control wire, a spark each data wire"><i data-icon="flow"></i></button>
      <span class="tsep" aria-hidden="true"></span>
      <button id="btn-live" class="iconbtn" aria-label="Follow runs live" title="Live: replay each new run as it lands, and follow what you Play"><i data-icon="pulse"></i></button>
      <button id="btn-legend" class="iconbtn" aria-label="How to read the canvas" title="How to read the canvas"><i data-icon="help"></i></button>
    </div>
    <div id="find" class="popover findbox" hidden>
      <i data-icon="search"></i>
      <input id="find-input" type="text" placeholder="Find a node…" autocomplete="off" aria-label="Find a node">
      <kbd>Enter</kbd>
    </div>
    <div id="legend" class="popover" hidden></div>

    <div id="dragbar" title="Drag to resize · double-click to reset"></div>
    <aside id="sidebar" aria-label="Side panel">
      <nav id="sidetabs" role="tablist">
        <button data-side="assistant" class="active" role="tab"><i data-icon="spark"></i><span>Assistant</span><span class="tabdot" aria-hidden="true"></span></button>
        <button data-side="inspect" role="tab" title="What is picked on the canvas: an op's details, or START — the flow's input, where it is played">Details</button>
        <span class="spacer"></span>
        <button id="side-close" class="iconbtn" aria-label="Close the panel" title="Close"><i data-icon="x"></i></button>
      </nav>
      <div id="inspector" class="open"></div>
      <div id="playground" class="playpanel" hidden></div>
      <aside id="chatdock" hidden></aside>
    </aside>
  </div>
</div>

</body>

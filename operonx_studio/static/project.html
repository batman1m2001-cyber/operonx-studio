<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>operonx studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c9940f'/%3E%3Ccircle cx='12' cy='12' r='5.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='18.3' cy='5.7' r='1.7' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/studio.css">
</head>
<body data-tab="flow">
<div class="shell">
  <header class="bar">
    <a class="brand" href="/" title="All projects" aria-label="operonx studio — all projects">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6"/><circle cx="12" cy="12" r="5.2"/><circle class="dot" cx="18.3" cy="5.7" r="1.7"/></svg>
      <span class="brand-name">operonx</span>
    </a>
    <nav class="crumbs" aria-label="Location">
      <span class="sep" aria-hidden="true">/</span>
      <button class="crumbbtn projname" id="pname" aria-haspopup="menu" title="Switch project">…</button>
      <div id="switcher" class="popover" role="menu" hidden></div>
      <span class="sep" aria-hidden="true">/</span>
      <button id="btn-project" class="crumbbtn graphname" aria-haspopup="menu" title="Operons, services and jobs of this project"><span id="graph-name">…</span></button>
      <div id="pmenu" class="popover" role="menu" hidden></div>
      <select id="graph-pick" title="graph" hidden></select>
    </nav>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button data-tab="flow" class="active" role="tab">Flow</button>
      <button data-tab="traces" role="tab">Runs</button>
      <button data-tab="playground" role="tab">Playground</button>
      <button data-tab="monitor" role="tab">Monitor</button>
      <button data-tab="jobs" role="tab">Jobs</button>
      <button data-tab="resources" role="tab">Resources</button>
    </nav>
    <div class="spacer"></div>
    <span class="live" id="live" title="The studio re-extracts and redraws whenever the project's code changes"><span class="dot"></span><span id="live-text">live</span></span>
    <button id="btn-settings" class="iconbtn" data-tabbtn="settings" aria-label="Settings" title="Settings — retention, where runs are kept"><i data-icon="settings"></i></button>
    <button id="btn-right" class="iconbtn paneltoggle" aria-label="Toggle the side panel" title="Side panel — inspect · assistant"><i data-icon="panel"></i></button>
  </header>

  <div class="main">
    <div id="stage">
      <div id="world">
        <div id="plane">
          <svg id="edges" class="wires"></svg>
          <div id="nodes"></div>
          <!-- decision wires re-surface here: the stretch that would
               hide under a branch card paints again above it -->
          <svg id="edgetop" class="wires"></svg>
        </div>
      </div>
    </div>
    <div id="traces" hidden></div>
    <div id="jobs" hidden></div>
    <div id="resources" hidden></div>
    <div id="playground" class="pane" hidden></div>
    <div id="monitor" class="pane" hidden></div>
    <div id="settings" class="pane" hidden></div>

    <!-- the canvas's own controls: they float over the canvas wherever it
         is showing (the Flow tab, or a run's workflow view) -->
    <div id="canvasbar" class="canvasbar" role="toolbar" aria-label="Canvas">
      <button id="btn-find" class="iconbtn" aria-label="Find a node" title="Find a node  ( / or Ctrl+K )"><i data-icon="search"></i></button>
      <button id="btn-expand" class="iconbtn" aria-label="Open every nested graph" title="Open / close every nested graph"><i data-icon="unfold"></i></button>
      <span class="tsep" aria-hidden="true"></span>
      <button id="btn-zoom-out" class="iconbtn" aria-label="Zoom out" title="Zoom out  ( − )"><i data-icon="minus"></i></button>
      <button id="btn-zoom-pct" class="zoompct" title="Reset to 100%  ( 1 )">100%</button>
      <button id="btn-zoom-in" class="iconbtn" aria-label="Zoom in" title="Zoom in  ( + )"><i data-icon="plus"></i></button>
      <button id="btn-fit" class="iconbtn" aria-label="Fit width" title="Fit the flow's width  ( 0 )"><i data-icon="fit"></i></button>
      <span class="tsep" aria-hidden="true"></span>
      <button id="btn-legend" class="iconbtn" aria-label="How to read the canvas" title="How to read the canvas"><i data-icon="help"></i></button>
    </div>
    <div id="find" class="popover findbox" hidden>
      <i data-icon="search"></i>
      <input id="find-input" type="text" placeholder="Find a node…" autocomplete="off" aria-label="Find a node">
      <kbd>Enter</kbd>
    </div>
    <div id="legend" class="popover" hidden></div>

    <div id="dragbar" title="Drag to resize · double-click to reset"></div>
    <aside id="sidebar" aria-label="Side panel">
      <nav id="sidetabs" role="tablist">
        <button data-side="inspect" class="active" role="tab">Inspect</button>
        <button data-side="assistant" role="tab">Assistant</button>
        <span class="spacer"></span>
        <button id="side-close" class="iconbtn" aria-label="Close the panel" title="Close"><i data-icon="x"></i></button>
      </nav>
      <div id="inspector" class="open"></div>
      <aside id="chatdock" hidden></aside>
    </aside>
  </div>
</div>
<script src="/static/icons.js"></script>
<script src="/static/values.js"></script>
<script src="/static/providers.js"></script>
<script src="/static/timeline.js"></script>
<script src="/static/studio.js"></script>
<script src="/static/runview.js"></script>
<script src="/static/runs.js"></script>
<script src="/static/monitor.js"></script>
<script src="/static/play.js"></script>
<script src="/static/settings.js"></script>
<script src="/static/chat.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
<title>Projects — operonx studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c9940f'/%3E%3Ccircle cx='12' cy='12' r='5.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='18.3' cy='5.7' r='1.7' fill='white'/%3E%3C/svg%3E">
<script>/* the theme before the first paint (theme.js keeps it in step) */try{var t=localStorage.getItem("ox:theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/static/studio.css">
</head>
<body class="page">
<header class="topbar">
  <a class="brand" href="/" aria-label="operonx studio">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6"/><circle cx="12" cy="12" r="5.2"/><circle class="dot" cx="18.3" cy="5.7" r="1.7"/></svg>
    <span class="brand-name">operonx</span><span class="brand-sub">studio</span>
  </a>
  <span class="spacer"></span>
  <span id="themeslot"></span>
  <span id="accountslot"></span>
</header>

<main class="home">
  <section class="homehero" aria-label="Assistant">
    <div id="axhero"></div>
  </section>

  <div class="homegrid">
    <section class="homeprojects" aria-labelledby="projects-title">
      <div class="homehead">
        <h2 id="projects-title">Projects</h2>
        <div class="actions">
          <button id="btn-new" class="needs-edit" type="button"><i data-icon="plus"></i><span>New project</span></button>
          <button id="btn-open" class="needs-edit" type="button"><i data-icon="folder"></i><span>Open project</span></button>
        </div>
      </div>
      <label class="searchfield" id="filterwrap" hidden>
        <i data-icon="search"></i>
        <input id="filter" type="text" placeholder="Filter by name or path" autocomplete="off" aria-label="Filter projects">
      </label>
      <div class="projlist" id="projects" aria-live="polite"></div>
    </section>
    <section class="homerecent" aria-labelledby="recent-title" hidden>
      <div class="homehead"><h2 id="recent-title">Recent conversations</h2></div>
      <div class="recentlist" id="recent"></div>
    </section>
  </div>
</main>

<div id="modal-root"></div>

<script src="/static/icons.js"></script>
<script src="/static/theme.js"></script>
<script src="/static/account.js"></script>
<script src="/static/home.js"></script>
<script src="/static/values.js"></script>
<script src="/static/paste.js"></script>
<script src="/static/assistant.js"></script>
</body>
</html>
